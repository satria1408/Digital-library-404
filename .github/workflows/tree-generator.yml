name: Generate Project Tree

on:
  push:
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install & Generate Tree
        run: |
          sudo apt-get update && sudo apt-get install -y tree
          echo "# Project Structure" > TREE.md
          echo "Last updated: $(date)" >> TREE.md
          echo '```' >> TREE.md
          tree -I 'vendor|node_modules|storage|.git|.github' >> TREE.md
          echo '```' >> TREE.md

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update project tree structure"
          file_pattern: "TREE.md"